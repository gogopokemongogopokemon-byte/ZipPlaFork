name: Build ZipPla

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild source/ZipPla.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ZipPla-fixed
          path: source/ZipPla/bin/Release/
